<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="Style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@100..800&display=swap" rel="stylesheet">
</head>
<body>
    <img src="../aComponentes/bienvenidos.png" class="bienvenidos">
    <img src="../aComponentes/Titulo.png"  class="nutrium">
    <img src="../aComponentes/Slogan.png"  class="slogan">


    <article class="formulario">
    <h1 class="titulo">Ingresá con tu correo</h1>
    <form id="form" class="form">

        <label>Correo Electronico</label>
        <div class="contencion">
        <img src="../aComponentes/ci_mail.png" alt="" class="sobre">
        <input type="email" name="email" class="email" placeholder="ejemplo@gmail.com">
        </div>


        <label>Contraseña</label>
        <div class="contencion">
        <img class="candado" src="../aComponentes/candado.png" alt="">
        <input type="password" name="contraseña" class="contra" placeholder="escribe tu contraseña">
        </div>

        <p class="contraseña">¿Olvidaste tu contraseña?</p>
        <div class="sufrimiento">
            <img src="../aComponentes/UsuarioBlanco.png" alt="" class="usuario">
        <button type="submit" id="boton" class="boton">INICIAR SESIÓN</button>
        </div>
    </form>

    <h2 class="pregunta">¿Aún no tienes cuenta?</h2>
          <div class="sufrimiento">
            <img src="../aComponentes/Usuario+.png" alt="" class="usuario-mas">
    <button data-href="../sign-up" class="sign-up">CREAR CUENTA</button>
</div>
    </article>

<script src="script.js"></script>
</body>
</html>
