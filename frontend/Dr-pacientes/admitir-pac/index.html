<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admitir paciente</title>
    <link rel="stylesheet" href="main.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@100..800&display=swap" rel="stylesheet">
</head>
<body>
    <section class="arriba">
        <img class="Titulo" src="../../aComponentes/Titulo.png" alt="Nutrium">
        <img class="logo" src="../../aComponentes/Logo.png" alt="Logo">
    </section>

    <section class="medio">
        <article class="cont">
            <div class="atras" data-href="../home/index.html">
                <img class="flechita" src="../../aComponentes/akar-icons_arrow-left.png" alt="">
            </div>
        </article>

        <form class="fondo" id="formulario">
            <img class="ftito" src="../../aComponentes/Frame67.png" alt="">

            <section class="info">
                <section class="izq">
                    <label class="etq etqNombre" for="nombre">Nombre:</label>
                    <label class="etq" for="email">Correo:</label>
                    <label class="etq etqNotas" for="notas">Notas:</label>
                </section>
                <section class="der">
                    <input class="txt" id="nombre" name="nombre" placeholder="Insertar nombre completo" required type="text">
                    <input class="txt" id="email" name="email" placeholder="Insertar correo electrónico" required type="email">
                    <textarea class="txt" id="notas" name="notas" placeholder="Insertar notas (opcional)"></textarea>
                </section>
            </section>

            <button class="agregar" type="submit" id="agregar">Agregar</button>
            <img class="nutria" src="../../aComponentes/nutriaAdmitir.png" alt="">
        </form>
    </section>

    <section class="abajo">
        <div class="btnsabajo">
            <div class="Home"><img class="homeimg" src="../../aComponentes/home.png" data-href="../../home/doctor/index.html" alt=""></div>
            <img class="Mapa" src="../../aComponentes/Predeterminado.png" data-href="../../lista/home/index.html" alt="">
            <img class="Escaner" src="../../aComponentes/Escáner.png" data-href="../../scanner/home/index.html" alt="">
            <img class="Guardados" src="../../aComponentes/Guardados.png" data-href="../../guardados/home/index.html" alt="">
            <div class="Usuario"><img class="imgUsuario" src="../../aComponentes/Usuario.png" data-href="../../info-perfil/index.html" alt=""></div>
        </div>
    </section>

    <script src="script.js" defer></script>
</body>
</html>
