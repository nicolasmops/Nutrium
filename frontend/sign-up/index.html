<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="Style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@100..800&display=swap" rel="stylesheet">
</head>
<body>
 <section class="arriba">
        <img class="Titulo" src="../aComponentes/Titulo.png" alt="Nutrium">
        <img class="logo" src="../aComponentes/Logo.png" alt="Logo">
    </section>
    <section class="medio">
        <form class="formulario" id="formulario">
            <p class="crear">¡Crea una cuenta!</p>
            <label for="nombre" class="labels name">Nombre completo <span class="asterisco">*</span></label>
            <input type="text" name="nombre" class ="input" placeholder="Escribe tu nombre" required>
            <label for="fecha" class="labels date">Fecha de nacimiento <span class="asterisco">*</span></label>
        <section class="nacimiento">    
            <input type="number" name="fecha" class="input dia" min="1" max="31" placeholder="DD" required>
            <select name="fecha" id="mes" class="input mes" required>
                <option value="" class="value">MES</option>
                <option value="enero" class="value">Enero</option>
                <option value="febrero" class="value">Febrero</option>
                <option value="marzo" class="value">Marzo</option>
                <option value="abril" class="value">Abril</option>
                <option value="mayo" class="value">Mayo</option>
                <option value="junio" class="value">Junio</option>
                <option value="julio" class="value">Julio</option>
                <option value="agosto" class="value">Agosto</option>
                <option value="septiembre" class="value">Septiembre</option>
                <option value="octubre" class="value">Octubre</option>
                <option value="noviembre" class="value">Noviembre</option>
                <option value="diciembre" class="value">Diciembre</option>
            </select>
            <input type="number" class=" input año" placeholder="YYYY" min="0" max="2027" required>
            <button type="submit"></button>
        </section>
            <label for="mail" class="labels date">Correo electrónico <span class="asterisco">*</span></label>
            <input type="email" name="mail" class="input" placeholder="ejemplo@correo.com" required>
            <label for="contraseña" class="labels date">Contraseña <span class="asterisco">*</span></label>
            <input type="password" name="contraseña" class="input" placeholder="Crea tu contraseña" required>
        <div class="contenedor">
            <input type="checkbox" name="t&c" id="t&c" class= "checkbox">
           <div class="t">
            <label for="t&c" class="labels tYc">He leido y acepto los <a href="https://youtu.be/SbYXkOAoZpI?si=IWSsgb0tXy5Gmh5h">términos y <p class="abajo">condiciones</p></a></label>
           </div> 
        </div>
        </form>
    </section>
    
</body>
</html>
