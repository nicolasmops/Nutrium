<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="Style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@100..800&display=swap" rel="stylesheet">
</head>
<body>
 <section class="arriba">
        <img class="Titulo" src="../aComponentes/Titulo.png" alt="Nutrium">
        <img class="logo" src="../aComponentes/Logo.png" alt="Logo">
    </section>
    <section class="medio">
        <form class="formulario" id="formulario">
            <p class="crear">¡Crea una cuenta!</p>
            <label for="nombre" class="labels name">Nombre completo <span class="asterisco">*</span></label>
            <input type="text" name="nombre" class="input" placeholder="Escribe tu nombre" id="nombre" required>
            <label for="dia" class="labels date">Fecha de nacimiento <span class="asterisco">*</span></label>
        <section class="nacimiento">
            <input type="number" name="dia" id="dia" class="input dia" min="1" max="31" maxlength="2" placeholder="DD" required>
            <select name="mes" id="mes" class="input mes" required>
                <option value="" class="value">MES</option>
                <option value="01" class="value">Enero</option>
                <option value="02" class="value">Febrero</option>
                <option value="03" class="value">Marzo</option>
                <option value="04" class="value">Abril</option>
                <option value="05" class="value">Mayo</option>
                <option value="06" class="value">Junio</option>
                <option value="07" class="value">Julio</option>
                <option value="08" class="value">Agosto</option>
                <option value="09" class="value">Septiembre</option>
                <option value="10" class="value">Octubre</option>
                <option value="11" class="value">Noviembre</option>
                <option value="12" class="value">Diciembre</option>
            </select>
            <input type="number" name="anio" id="anio" class="input año" placeholder="YYYY" min="1900" max="2027" maxlength="4" required>
        </section>
            <label for="mail" class="labels date">Correo electrónico <span class="asterisco">*</span></label>
            <input type="email" name="mail" id="mail" class="input" placeholder="ejemplo@correo.com" required>
            <label for="contrasena" class="labels date">Contraseña <span class="asterisco">*</span></label>
            <input type="password" name="contrasena" id="contrasena" class="input" placeholder="Crea tu contraseña" required>
        <select name="esMedico" id="medico" class="medico">
                <option value="" class="value">¿Eres médico?</option>
                <option value="true" class="value">Sí</option>
                <option value="false" class="value">No</option>
            </select>
        
            <div class="contenedor">
            <input type="checkbox" name="t&c" id="t&c" class="checkbox" required>
           <div class="t">
            <label for="t&c" class="labels tYc">He leido y acepto los <a href="https://youtu.be/SbYXkOAoZpI?si=IWSsgb0tXy5Gmh5h">términos y <p class="abajo">condiciones</p></a></label>
           </div>
        </div>
        <button type="submit" class="crearCuenta" id="crearCuenta">
            <img class="persona" src="../aComponentes/crearCuenta.png">
            <p class="txt">CREAR CUENTA</p>
        </button>
        <p class="tCuenta">¿Ya tienes cuenta?</p>
        <button type="button" class="crearCuenta login btn" data-href="../log-in/index.html">
            <img class="persona" src="../aComponentes/LOGIN.png">
            <p class="txt login">INICIAR SESIÓN</p>
        </button>
        </form>
    </section>
    <script src="script.js" defer></script>
</body>
</html>
