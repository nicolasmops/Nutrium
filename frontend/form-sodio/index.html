<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="Style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@100..800&display=swap" rel="stylesheet">
</head>
<body>
   <img src="../aComponentes/bienvenidos.png" class="bienvenidos">
   <img src="../aComponentes/Titulo.png"  class="nutrium">
   <img src="../aComponentes/Slogan.png"  class="slogan">
   <form  class="sodio" id="formulario" >
    <p class="ayuda">Ayudanos a ayudarte</p>
    <label for="miligramos" class="pregunta">¿Cuánto sodio podés comer cada 100g?</label>
    <input type="text" id="miligramos" name="miligramos" placeholder="Escribe aquí" required>
    <select name="esMedico" id="medico" class="medico">
        <option value="" class="value">¿Eres médico?</option>
        <option value="true" class="value">Sí</option>
        <option value="false" class="value">No</option>
    </select>
    <button type="submit" class="boton" id="boton">CONTINUAR</button>
   </form>
    <script src="script.js"></script>
</body>
</html>
