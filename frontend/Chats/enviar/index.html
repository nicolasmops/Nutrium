<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mensaje recibido</title>
    <link rel="stylesheet" href="main.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@100..800&display=swap" rel="stylesheet">
</head>
<body>
    <section class="arriba">
        <img class="Titulo" src="../../aComponentes/Titulo.png" alt="Nutrium">
        <img class="logo" src="../../aComponentes/Logo.png" alt="Logo">
    </section>

    <section class="medio">
        <article class="cont">
            <div class="atras" data-href="../home/index.html">
                <span class="flechita">←</span>
            </div>
        </article>

        <article class="mensaje">
            <section class="head">
                <div class="fila">
                    <div class="de izq">De:</div>
                    <input type="email" id="enviador"class="der"></input>
                </div>
                <div class="fila">
                    <div class="para izq">Para:</div>
                    <input type="email" class="der" id="recibidor"></input>
                </div>
                <div class="fila">
                    <div class="asunto izq">Asunto:</div>
                    <input type="text" class="der info" id="asunto"></input>
                </div>
            </section>

            <section class="contenido">
                <input type="text" class=" der texto" id="texto"></input>
                <div class="envio">
                    <button class="enviar" type="button" id="enviar">Enviar</button>
                </div>
            </section>
        </article>
    </section>

    <section class="abajo">
        <div class="btnsabajo">
            <div class="Home" data-href="../../home/paciente/index.html">
                <img class="homeimg" src="../../aComponentes/home.png" alt="Home">
            </div>
            <img class="Mapa" src="../../aComponentes/Predeterminado.png" alt="Lista" data-href="../../lista/home/index.html">
            <img class="Escaner" src="../../aComponentes/Escáner.png" alt="Escáner" data-href="../../scanner/home/index.html">
            <img class="Guardados" src="../../aComponentes/Guardados.png" alt="Guardados" data-href="../../guardados/home/index.html">
            <img class="Usuario" src="../../aComponentes/Usuario.png" alt="Usuario" data-href="../../info-perfil/index.html">
        </div>
    </section>

    <script src="script.js" defer></script>
</body>
</html>
