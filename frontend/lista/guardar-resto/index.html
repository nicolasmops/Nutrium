<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guardar restaurante</title>
    <link rel="stylesheet" href="main.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@100..800&display=swap" rel="stylesheet">
</head>
<body>
    <section class="arriba">
        <img class="Titulo" src="../../aComponentes/Titulo.png" alt="Nutrium">
        <img class="logo" src="../../aComponentes/Logo.png" alt="Logo">
    </section>

    <section class="medio">
        <article class="cont">
            <div class="atras" data-href="../home/index.html">
                <img class="flechita" src="../../aComponentes/akar-icons_arrow-left.png " alt="">
            </div>
        </article>

        <form class="restaurant" id="form">
            <div class="zonaSubir">
                <input type="file" id="imagen" name="imagen" accept="image/*" required>
                <div class="subir" id="subir">Subir archivo</div>
                <div class="mas">
                    <div class="hor"></div>
                    <div class="ver"></div>
                </div>
            </div>

            <input type="text" class="txtn" name="nombre" placeholder="Insertar nombre" required>
            <input type="text" class="txtad" name="address" placeholder="Insertar dirección" required>
            <textarea class="txtd" name="descripcion" placeholder="Insertar descripción (opcional)"></textarea>

            <button type="submit" id="boton" class="BTNGUARDAR">Guardar</button>
            <img class="nutria" src="../../aComponentes/nutriaPizza.png" alt="">
        </form>
    </section>

       <section class="abajo">
        <div class="btnsabajo">
            <div class="Home"><img class="homeimg" src="../../aComponentes/home.png" data-href="../../home/paciente/index.html" alt=""></div>
            <div class="seleccionado"><img class="Mapa" src="../../aComponentes/Predeterminado.png" data-href="../../lista/home/index.html" alt=""></div>
            <img class="Escaner" src="../../aComponentes/Escáner.png" data-href="../../scanner/home/index.html" alt="">
           <div class="Guardados"> <img class="imgguardados" src="../../aComponentes/Guardados.png" data-href="../../guardados/home/index.html" alt=""></div>
            <img class="Usuario" src="../../aComponentes/Usuario.png" data-href="../../info-perfil/index.html" alt="">
        </div>
    </section>

    <script src="script.js" defer></script>
</body>
</html>
